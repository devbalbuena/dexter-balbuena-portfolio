<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="lux-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a07" />
      <stop offset="50%" stop-color="#19110b" />
      <stop offset="100%" stop-color="#080604" />
    </linearGradient>
    <linearGradient id="gold-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e6b3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c532b" />
    </linearGradient>
    <filter id="card-blur-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#lux-bg)" />
  <circle cx="960" cy="540" r="450" fill="#d4af37" fill-opacity="0.06" filter="blur(100px)" />

  <!-- Top Center Luxury Monogram -->
  <g transform="translate(960, 100)">
    <circle cx="0" cy="0" r="36" fill="#1b120c" stroke="#8c532b" stroke-width="1.5" />
    <text x="0" y="8" fill="#d4af37" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">RF</text>
    <text x="0" y="65" fill="#a89a8c" font-family="monospace" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle">RAREFINDS • CONSIGNMENT ERP</text>
  </g>

  <!-- Massive Hero Banner Typography -->
  <g transform="translate(960, 260)">
    <text x="0" y="60" fill="#fdfbf9" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" text-anchor="middle">
      The Standard in Authenticated Luxury.
    </text>
    <text x="0" y="145" fill="url(#gold-title)" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" text-anchor="middle">
      100% Curated 1-of-1 Collectibles.
    </text>
    <text x="0" y="210" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
      Every pair protected by cryptographic delivery PINs, physical curator blacklight inspection, and real-time inventory locking.
    </text>
  </g>

  <!-- 3 Layered Feature Cards Row -->
  <g transform="translate(180, 560)">
    <!-- Card 1 -->
    <g filter="url(#card-blur-glow)">
      <rect width="480" height="280" rx="24" fill="#18110b" stroke="#3d2a1b" stroke-width="1.5" />
      <rect x="35" y="35" width="56" height="56" rx="14" fill="#2d1d12" stroke="#8c532b" />
      <text x="63" y="70" fill="#d4af37" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">🔒</text>
      <text x="35" y="135" fill="#fdfbf9" font-family="system-ui" font-size="24" font-weight="800">Concurrency-Safe Engine</text>
      <text x="35" y="170" fill="#a89a8c" font-family="system-ui" font-size="16">PostgreSQL atomic transaction row locks ($transaction) prevent double-selling on rare 1-of-1 items.</text>
      <text x="35" y="235" fill="#d4af37" font-family="monospace" font-size="13" font-weight="bold">ZERO OVERSOLD PAIRS ➔</text>
    </g>

    <!-- Card 2 (Center Active Card) -->
    <g transform="translate(540, -20)" filter="url(#card-blur-glow)">
      <rect width="480" height="320" rx="24" fill="#20150d" stroke="#d4af37" stroke-width="2" />
      <rect x="35" y="35" width="56" height="56" rx="14" fill="#3a2517" stroke="#d4af37" />
      <text x="63" y="70" fill="#d4af37" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">🛡️</text>
      <text x="35" y="135" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="800">Cryptographic Delivery PIN</text>
      <text x="35" y="170" fill="#c4b5a5" font-family="system-ui" font-size="16">Riders must collect and verify recipient's 4-digit token (crypto.randomInt) before handing over high-ticket goods.</text>
      <rect x="35" y="225" width="220" height="42" rx="10" fill="#d4af37" />
      <text x="145" y="251" fill="#18120d" font-family="system-ui" font-size="13" font-weight="900" text-anchor="middle">ZERO FRAUD DISPUTES</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(1080, 0)" filter="url(#card-blur-glow)">
      <rect width="480" height="280" rx="24" fill="#18110b" stroke="#3d2a1b" stroke-width="1.5" />
      <rect x="35" y="35" width="56" height="56" rx="14" fill="#2d1d12" stroke="#8c532b" />
      <text x="63" y="70" fill="#34d399" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">✓</text>
      <text x="35" y="135" fill="#fdfbf9" font-family="system-ui" font-size="24" font-weight="800">5-Step State Fulfillment</text>
      <text x="35" y="170" fill="#a89a8c" font-family="system-ui" font-size="16">Placed ➔ Paid ➔ Authenticated &amp; Stamped ➔ Dispatched ➔ Claimed. Zero skipped checkpoints.</text>
      <text x="35" y="235" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">100% AUDITABLE TRAIL ➔</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(960, 990)">
    <text x="0" y="20" fill="#574332" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2">
      16:9 PROMOTIONAL STOREFRONT ASSET • ARCHITECTED IN CANVA PRO &amp; FIGMA
    </text>
  </g>
</svg>
