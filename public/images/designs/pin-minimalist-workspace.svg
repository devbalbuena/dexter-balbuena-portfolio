<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="workspace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfaf8" />
      <stop offset="50%" stop-color="#f3ede5" />
      <stop offset="100%" stop-color="#e5d7c5" />
    </linearGradient>
    <linearGradient id="copper-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c532b" />
      <stop offset="100%" stop-color="#c48247" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#18120d" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#workspace-bg)" />

  <!-- Top Brand Navigation Row -->
  <g transform="translate(100, 70)">
    <rect width="800" height="54" rx="27" fill="#ffffff" stroke="#e8ded3" stroke-width="2" />
    <circle cx="45" cy="27" r="14" fill="#8c532b" />
    <text x="45" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">DB</text>
    <text x="75" y="34" fill="#18120d" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">MINIMALIST DESK SETUP</text>
    <rect x="630" y="12" width="150" height="30" rx="15" fill="#8c532b" fill-opacity="0.1" />
    <text x="705" y="32" fill="#8c532b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CANVA &amp; FIGMA</text>
  </g>

  <!-- Main Hook Headline -->
  <text x="100" y="210" fill="#8c532b" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3">ORGANIC PINTEREST PIN</text>
  <text x="100" y="275" fill="#18120d" font-family="system-ui, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">
    How To Build A Clean
  </text>
  <text x="100" y="345" fill="#8c532b" font-family="system-ui, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">
    Productive Workspace
  </text>
  <text x="100" y="405" fill="#57493a" font-family="system-ui, sans-serif" font-size="24" font-weight="500">
    Zero cables, warm ambient lighting, and walnut wood finishes under $150 total.
  </text>

  <!-- Large Visual Hero Card -->
  <g transform="translate(100, 460)" filter="url(#soft-shadow)">
    <rect width="800" height="560" rx="28" fill="#1a140f" />
    <!-- Ambient glow inside preview -->
    <circle cx="400" cy="280" r="260" fill="#8c532b" fill-opacity="0.25" filter="blur(60px)" />
    
    <!-- Monitor light bar silhouette & desk shelf -->
    <rect x="180" y="160" width="440" height="12" rx="6" fill="#e8ded3" />
    <line x1="400" y1="172" x2="400" y2="240" stroke="#70533f" stroke-width="6" />
    <rect x="220" y="240" width="360" height="180" rx="12" fill="#0d0a07" stroke="#4a3627" stroke-width="2" />
    <text x="400" y="335" fill="#d4af37" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">FIGMA 2:3 POSTER</text>
    <text x="400" y="365" fill="#a89988" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Curated Buyer Intent Asset</text>

    <!-- Desk shelf wooden plank -->
    <rect x="120" y="450" width="560" height="24" rx="8" fill="#8c532b" />
    <rect x="180" y="474" width="28" height="30" fill="#3a2517" />
    <rect x="592" y="474" width="28" height="30" fill="#3a2517" />
  </g>

  <!-- Split 2-Column Product Specs -->
  <g transform="translate(100, 1070)">
    <!-- Card 1 -->
    <rect width="385" height="240" rx="20" fill="#ffffff" stroke="#ebdccb" stroke-width="1.5" />
    <circle cx="50" cy="55" r="24" fill="#8c532b" fill-opacity="0.1" />
    <text x="50" y="62" fill="#8c532b" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">01</text>
    <text x="90" y="52" fill="#18120d" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Cable Management</text>
    <text x="90" y="74" fill="#786c5e" font-family="monospace" font-size="13">Under-Desk Wire Tray</text>
    <text x="35" y="130" fill="#57493a" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      Hidden channel mounts keep all power bricks and charging leads completely out of sight.
    </text>
    <rect x="35" y="175" width="130" height="32" rx="16" fill="#f5eee6" />
    <text x="100" y="196" fill="#8c532b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">$24.99 • Amazon</text>

    <!-- Card 2 -->
    <g transform="translate(415, 0)">
      <rect width="385" height="240" rx="20" fill="#ffffff" stroke="#ebdccb" stroke-width="1.5" />
      <circle cx="50" cy="55" r="24" fill="#8c532b" fill-opacity="0.1" />
      <text x="50" y="62" fill="#8c532b" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">02</text>
      <text x="90" y="52" fill="#18120d" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Warm Light Bar</text>
      <text x="90" y="74" fill="#786c5e" font-family="monospace" font-size="13">Screen-Glare Free</text>
      <text x="35" y="130" fill="#57493a" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
        Asymmetric optical design prevents screen reflection while bathing the desk in 2700K amber glow.
      </text>
      <rect x="35" y="175" width="130" height="32" rx="16" fill="#f5eee6" />
      <text x="100" y="196" fill="#8c532b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">$39.99 • Amazon</text>
    </g>
  </g>

  <!-- Bottom CTA / Save Button -->
  <g transform="translate(100, 1360)">
    <rect width="800" height="70" rx="35" fill="#8c532b" />
    <text x="400" y="43" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      📌 Save This Pin for Setup Inspo
    </text>
  </g>
</svg>
