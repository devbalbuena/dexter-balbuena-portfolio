<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="vault-pin-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140e09" />
      <stop offset="50%" stop-color="#1e150f" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>
    <linearGradient id="vault-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e6b3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c532b" />
    </linearGradient>
    <filter id="vault-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Luxury Canvas -->
  <rect width="1000" height="1500" fill="url(#vault-pin-bg)" />
  <circle cx="500" cy="700" r="450" fill="#d4af37" fill-opacity="0.08" filter="blur(90px)" />

  <!-- Top Brand Navigation Row -->
  <g transform="translate(100, 70)">
    <rect width="800" height="54" rx="27" fill="#20150d" stroke="#3d2a1b" stroke-width="1.5" />
    <circle cx="45" cy="27" r="14" fill="#d4af37" />
    <text x="45" y="32" fill="#18120d" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">RF</text>
    <text x="75" y="34" fill="#fdfbf9" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2">RAREFINDS LUXURY VAULT</text>
    <rect x="620" y="12" width="160" height="30" rx="15" fill="#d4af37" fill-opacity="0.15" />
    <text x="700" y="32" fill="#f5e6b3" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1-OF-1 CONSIGNMENT</text>
  </g>

  <!-- Headline Block -->
  <g transform="translate(100, 170)">
    <rect width="180" height="34" rx="8" fill="#d4af37" />
    <text x="90" y="23" fill="#18120d" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2">AUTHENTIC GRAIL</text>

    <text x="0" y="110" fill="#fdfbf7" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
      Travis Scott AJ1
    </text>
    <text x="0" y="190" fill="url(#vault-gold)" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
      Reverse Mocha.
    </text>
    <text x="0" y="240" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="22">
      US Men 9.5 • Deadstock Condition • Physical Blacklight QC Verified
    </text>
  </g>

  <!-- Hero Product Showcase Box -->
  <g transform="translate(100, 470)" filter="url(#vault-shadow)">
    <rect width="800" height="480" rx="28" fill="#1b120c" stroke="#442e1d" stroke-width="2" />
    
    <!-- Sneaker representation -->
    <rect x="30" y="30" width="740" height="300" rx="20" fill="#110b07" stroke="#2d1d12" />
    <circle cx="400" cy="180" r="130" fill="#d4af37" fill-opacity="0.08" />
    <path d="M220 220 Q320 120 480 150 T620 220 L600 260 Q420 270 240 260 Z" fill="#2d1d12" stroke="#d4af37" stroke-width="3" />
    <path d="M300 170 Q380 120 460 140 L520 190" fill="none" stroke="#f5e6b3" stroke-width="2" stroke-dasharray="4 4" />
    
    <rect x="60" y="60" width="160" height="30" rx="6" fill="#8c532b" fill-opacity="0.4" />
    <text x="140" y="80" fill="#f5e6b3" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SERIAL #0942-A</text>
    <rect x="610" y="60" width="130" height="30" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="675" y="80" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">✓ VERIFIED</text>

    <!-- Details Row -->
    <g transform="translate(45, 360)">
      <text x="0" y="35" fill="#f5e6b3" font-family="monospace" font-size="44" font-weight="900">₱84,500</text>
      <text x="210" y="28" fill="#786c5f" font-family="monospace" font-size="16">CONSIGNMENT PRICE</text>
      <text x="0" y="65" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="16">Handed over with 4-Digit Cryptographic Delivery PIN Verification</text>

      <rect x="490" y="10" width="220" height="52" rx="14" fill="url(#vault-gold)" />
      <text x="600" y="42" fill="#18120d" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">CLAIM 1-OF-1 ➔</text>
    </g>
  </g>

  <!-- Secondary Proof Grid -->
  <g transform="translate(100, 990)">
    <g filter="url(#vault-shadow)">
      <rect width="385" height="280" rx="24" fill="#1b120c" stroke="#3d2a1b" stroke-width="1.5" />
      <rect x="25" y="25" width="335" height="120" rx="14" fill="#110b07" />
      <text x="192" y="90" fill="#d4af37" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">🔒 ATOMIC ROW LOCK</text>
      <text x="25" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Zero Double-Selling</text>
      <text x="25" y="210" fill="#8c7866" font-family="system-ui, sans-serif" font-size="15">PostgreSQL $transaction locks</text>
      <text x="25" y="250" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">100% INVENTORY INTEGRITY</text>
    </g>

    <g transform="translate(415, 0)" filter="url(#vault-shadow)">
      <rect width="385" height="280" rx="24" fill="#1b120c" stroke="#3d2a1b" stroke-width="1.5" />
      <rect x="25" y="25" width="335" height="120" rx="14" fill="#110b07" />
      <text x="192" y="90" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">🛡️ 4-DIGIT CRYPTO PIN</text>
      <text x="25" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Fraud-Proof Handover</text>
      <text x="25" y="210" fill="#8c7866" font-family="system-ui, sans-serif" font-size="15">Local express rider verification</text>
      <text x="25" y="250" fill="#d4af37" font-family="monospace" font-size="16" font-weight="bold">ZERO DELIVERY DISPUTES</text>
    </g>
  </g>

  <!-- Bottom Pin CTA Footer Bar -->
  <g transform="translate(100, 1315)">
    <rect width="800" height="110" rx="24" fill="#110b07" stroke="#2e2015" />
    <text x="45" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Luxury Retail E-Commerce Creative 📌</text>
    <text x="45" y="82" fill="#d4af37" font-family="monospace" font-size="15">High-Ticket Consignment Poster • Designed in Canva Pro &amp; Figma</text>
    <rect x="620" y="30" width="145" height="50" rx="25" fill="#8c532b" />
    <text x="692" y="61" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">View Vault ↗</text>
  </g>
</svg>