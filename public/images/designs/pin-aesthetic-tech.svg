<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18120d" />
      <stop offset="50%" stop-color="#241b14" />
      <stop offset="100%" stop-color="#120d09" />
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#e6ca65" />
    </linearGradient>
    <filter id="shadow-dark" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#tech-bg)" />
  
  <!-- Subtle ambient radial light -->
  <circle cx="500" cy="650" r="420" fill="#8c532b" fill-opacity="0.18" filter="blur(80px)" />

  <!-- Top Badge -->
  <g transform="translate(100, 70)">
    <rect width="800" height="54" rx="27" fill="#241a12" stroke="#443224" stroke-width="1.5" />
    <circle cx="45" cy="27" r="14" fill="#d4af37" />
    <text x="45" y="32" fill="#18120d" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">★</text>
    <text x="75" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">VIRAL TIKTOK &amp; PINTEREST FINDS</text>
    <rect x="620" y="12" width="160" height="30" rx="15" fill="#10b981" fill-opacity="0.2" />
    <text x="700" y="32" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">24.3K VIEWS</text>
  </g>

  <!-- Typography Header -->
  <g transform="translate(100, 170)">
    <rect width="190" height="34" rx="8" fill="#d4af37" />
    <text x="95" y="23" fill="#18120d" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">TECH UPGRADE</text>

    <text x="0" y="110" fill="#fdfbf7" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" letter-spacing="-1">
      Clean Desk Tech
    </text>
    <text x="0" y="190" fill="url(#glow-gold)" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" letter-spacing="-1">
      That Looks 10x Pricier.
    </text>
    <text x="0" y="240" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="22">
      Tested ergonomic tools that turn cable clutter into an executive sanctuary.
    </text>
  </g>

  <!-- Center Showcase: Feature Card -->
  <g transform="translate(100, 470)" filter="url(#shadow-dark)">
    <rect width="800" height="480" rx="28" fill="#201711" stroke="#4a3424" stroke-width="2" />
    
    <!-- Hero Mockup graphic inside -->
    <rect x="30" y="30" width="740" height="280" rx="20" fill="#120c08" stroke="#2d1f14" />
    
    <!-- Keyboard & Mouse setup vector -->
    <rect x="100" y="100" width="420" height="140" rx="12" fill="#241810" stroke="#8c532b" stroke-width="1.5" />
    <text x="310" y="180" fill="#f5ede3" font-family="system-ui" font-size="22" font-weight="bold" text-anchor="middle">Custom CNC Aluminum 75% Keyboard</text>
    <circle cx="620" cy="170" r="45" fill="#38281c" stroke="#d4af37" stroke-width="2" />
    <text x="620" y="176" fill="#d4af37" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">ERGO</text>

    <!-- Specs row -->
    <g transform="translate(45, 340)">
      <text x="0" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="800">Precision Wireless Duo</text>
      <text x="0" y="65" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="18">Tri-mode Bluetooth 5.3 + 2.4GHz with Hot-Swap switches</text>

      <text x="0" y="115" fill="#d4af37" font-family="monospace" font-size="38" font-weight="900">$64.00</text>
      <text x="160" y="110" fill="#6e5a4a" font-family="monospace" font-size="20" text-decoration="line-through">$110.00</text>

      <rect x="490" y="75" width="220" height="50" rx="14" fill="#8c532b" />
      <text x="600" y="106" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Check Availability ↗</text>
    </g>
  </g>

  <!-- Secondary Split Cards -->
  <g transform="translate(100, 990)">
    <g filter="url(#shadow-dark)">
      <rect width="385" height="280" rx="24" fill="#201711" stroke="#3d2a1c" stroke-width="1.5" />
      <rect x="25" y="25" width="335" height="120" rx="14" fill="#120c08" />
      <circle cx="192" cy="85" r="32" fill="#d4af37" fill-opacity="0.1" />
      <text x="192" y="90" fill="#d4af37" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">USB-C HUB 10-IN-1</text>
      <text x="25" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Under-Desk Cable Dock</text>
      <text x="25" y="210" fill="#8c7866" font-family="system-ui, sans-serif" font-size="15">Hidden dual 4K HDMI mount</text>
      <text x="25" y="250" fill="#d4af37" font-family="monospace" font-size="24" font-weight="900">$29.99</text>
    </g>

    <g transform="translate(415, 0)" filter="url(#shadow-dark)">
      <rect width="385" height="280" rx="24" fill="#201711" stroke="#3d2a1c" stroke-width="1.5" />
      <rect x="25" y="25" width="335" height="120" rx="14" fill="#120c08" />
      <circle cx="192" cy="85" r="32" fill="#10b981" fill-opacity="0.1" />
      <text x="192" y="90" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">AMBIENT LIGHTBAR</text>
      <text x="25" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">RGB Backlight ScreenBar</text>
      <text x="25" y="210" fill="#8c7866" font-family="system-ui, sans-serif" font-size="15">Auto blue-light sensor</text>
      <text x="25" y="250" fill="#d4af37" font-family="monospace" font-size="24" font-weight="900">$42.50</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(100, 1315)">
    <rect width="800" height="110" rx="24" fill="#110c08" stroke="#332417" />
    <text x="45" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Designed with High-Conversion Visual SEO 📌</text>
    <text x="45" y="82" fill="#a89a8c" font-family="monospace" font-size="15">Canva Pro • 2:3 Vertical Pin • Optimized for Pinterest Smart Feed</text>
    <rect x="620" y="30" width="145" height="50" rx="25" fill="#8c532b" />
    <text x="692" y="61" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Save Pin ↗</text>
  </g>
</svg>