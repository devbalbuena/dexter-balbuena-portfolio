<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0b" />
      <stop offset="50%" stop-color="#1e1610" />
      <stop offset="100%" stop-color="#0e0a07" />
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#f3e5ab" />
      <stop offset="70%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8c532b" />
    </linearGradient>
    <filter id="ad-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Velvet Background -->
  <rect width="1080" height="1080" fill="url(#sq-bg)" />
  
  <!-- Subtle Amber Radial Ambient Backlight -->
  <circle cx="540" cy="500" r="380" fill="#8c532b" fill-opacity="0.12" filter="blur(60px)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1000" height="1000" rx="32" fill="none" stroke="#332417" stroke-width="2" />
  <rect x="52" y="52" width="976" height="976" rx="24" fill="none" stroke="#8c532b" stroke-opacity="0.25" stroke-width="1" />

  <!-- Top Brand Navigation Row -->
  <g transform="translate(90, 95)">
    <rect width="160" height="38" rx="8" fill="#241a12" stroke="#443224" stroke-width="1.5" />
    <text x="80" y="24" fill="#d4af37" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="3">RAREFINDS</text>
    <text x="900" y="24" fill="#a89a8c" font-family="monospace" font-size="13" text-anchor="end">VAULT DROP • 04 / 2026</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(90, 190)">
    <rect width="210" height="32" rx="6" fill="#8c532b" fill-opacity="0.25" stroke="#8c532b" stroke-opacity="0.5" />
    <text x="105" y="21" fill="#f3e5ab" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">AUTHENTICATED LUXURY</text>

    <text x="0" y="95" fill="#fdfbf7" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="-1">
      Limited 1-of-1
    </text>
    <text x="0" y="165" fill="url(#gold-metal)" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="-1">
      Grail Consignment.
    </text>
  </g>

  <!-- Center Stage Product Showcase Box -->
  <g transform="translate(90, 420)">
    <rect width="900" height="380" rx="24" fill="#1b130e" stroke="#4a3424" stroke-width="1.5" />
    
    <!-- Left Hero Graphic Silhouette / Sneaker Presentation -->
    <rect x="30" y="30" width="380" height="320" rx="18" fill="#110c08" stroke="#2e2015" />
    <circle cx="220" cy="190" r="110" fill="#d4af37" fill-opacity="0.06" />
    <!-- Sneaker representation outline -->
    <path d="M120 220 Q160 170 240 180 T320 220 L310 245 Q220 250 130 245 Z" fill="#2d1f14" stroke="#d4af37" stroke-width="2.5" />
    <path d="M160 190 Q200 150 250 160 L290 200" fill="none" stroke="#f3e5ab" stroke-width="2" stroke-dasharray="3 3" />
    
    <!-- Serial Tag -->
    <rect x="50" y="50" width="130" height="26" rx="6" fill="#8c532b" fill-opacity="0.3" />
    <text x="115" y="67" fill="#f3e5ab" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SERIAL #0942-A</text>
    <rect x="250" y="50" width="140" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="320" y="67" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✓ VERIFIED AUTH</text>

    <!-- Right Copy & Action -->
    <g transform="translate(450, 45)">
      <text x="0" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Travis Scott x AJ1 Low</text>
      <text x="0" y="65" fill="#a89a8c" font-family="system-ui, sans-serif" font-size="16">US Men 9.5 • Deadstock Condition</text>
      <text x="0" y="90" fill="#786c5f" font-family="system-ui, sans-serif" font-size="14">Blacklight UV &amp; Factory Stitch Verified</text>

      <line x1="0" y1="120" x2="410" y2="120" stroke="#332417" stroke-width="1.5" />

      <!-- Price & Handover Badge -->
      <text x="0" y="165" fill="#f3e5ab" font-family="monospace" font-size="40" font-weight="900">₱84,500</text>
      <text x="210" y="162" fill="#786c5f" font-family="monospace" font-size="14">DIRECT EXPRESS</text>
      
      <rect x="0" y="195" width="410" height="54" rx="14" fill="url(#gold-metal)" />
      <text x="205" y="228" fill="#18120d" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">
        CLAIM THIS 1-OF-1 PAIR ➔
      </text>
      <text x="205" y="275" fill="#8c7866" font-family="monospace" font-size="11" text-anchor="middle">
        Protected by 4-Digit Cryptographic Delivery PIN
      </text>
    </g>
  </g>

  <!-- Bottom Proof & Conversion Footer -->
  <g transform="translate(90, 840)">
    <rect width="900" height="145" rx="20" fill="#150f0b" stroke="#332417" />
    
    <g transform="translate(45, 45)">
      <text x="0" y="24" fill="#f3e5ab" font-family="system-ui, sans-serif" font-size="20" font-weight="800">High-Ticket Ad Creative Architecture</text>
      <text x="0" y="52" fill="#8c7866" font-family="system-ui, sans-serif" font-size="14">Designed in Canva Pro &amp; Figma with high-CTR buyer psychology.</text>
    </g>

    <g transform="translate(680, 45)">
      <rect width="180" height="55" rx="27" fill="#241a12" stroke="#8c532b" stroke-width="1.5" />
      <text x="90" y="34" fill="#f3e5ab" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1:1 INSTAGRAM AD</text>
    </g>
  </g>
</svg>
