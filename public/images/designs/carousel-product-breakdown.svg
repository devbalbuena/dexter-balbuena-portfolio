<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="car-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf9" />
      <stop offset="60%" stop-color="#f4ece2" />
      <stop offset="100%" stop-color="#e8dbcc" />
    </linearGradient>
    <filter id="soft-card" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#18120d" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Minimalist Editorial Canvas -->
  <rect width="1080" height="1080" fill="url(#car-bg)" />

  <!-- Top Carousel Slide Counter & Branding -->
  <g transform="translate(80, 80)">
    <rect width="180" height="38" rx="19" fill="#18120d" />
    <text x="90" y="24" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SLIDE 03 / 05</text>
    
    <text x="920" y="24" fill="#8c532b" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">SWIPE ➔</text>
  </g>

  <!-- Headline Block -->
  <g transform="translate(80, 160)">
    <rect width="160" height="30" rx="6" fill="#8c532b" fill-opacity="0.15" />
    <text x="80" y="20" fill="#8c532b" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">PRODUCT DEEP-DIVE</text>

    <text x="0" y="90" fill="#18120d" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
      Why Standard Office Chairs
    </text>
    <text x="0" y="155" fill="#8c532b" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
      Ruin Your Lower Back.
    </text>
  </g>

  <!-- Comparison Feature Stage -->
  <g transform="translate(80, 360)">
    <!-- Bad Chair (Red / Cross) -->
    <g filter="url(#soft-card)">
      <rect width="440" height="480" rx="24" fill="#ffffff" stroke="#fecaca" stroke-width="2" />
      <rect x="25" y="25" width="390" height="160" rx="16" fill="#fef2f2" />
      <circle cx="220" cy="105" r="32" fill="#ef4444" fill-opacity="0.15" />
      <text x="220" y="113" fill="#dc2626" font-family="system-ui" font-size="28" font-weight="900" text-anchor="middle">✕</text>
      
      <g transform="translate(30, 220)">
        <text x="0" y="24" fill="#991b1b" font-family="monospace" font-size="14" font-weight="bold">CONVENTIONAL FOAM PADDING</text>
        <text x="0" y="65" fill="#18120d" font-family="system-ui" font-size="24" font-weight="800">Flat Support &amp; Heat Traps</text>
        <text x="0" y="105" fill="#78716c" font-family="system-ui" font-size="16">• Foam compresses after 60 mins</text>
        <text x="0" y="135" fill="#78716c" font-family="system-ui" font-size="16">• Zero dynamic lumbar spine tracking</text>
        <text x="0" y="165" fill="#78716c" font-family="system-ui" font-size="16">• Causes pelvic tilt &amp; fatigue</text>
      </g>
    </g>

    <!-- Ergonomic Chair (Emerald / Check) -->
    <g transform="translate(480, 0)" filter="url(#soft-card)">
      <rect width="440" height="480" rx="24" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" />
      <rect x="25" y="25" width="390" height="160" rx="16" fill="#ecfdf5" />
      <circle cx="220" cy="105" r="32" fill="#10b981" fill-opacity="0.15" />
      <text x="220" y="113" fill="#059669" font-family="system-ui" font-size="28" font-weight="900" text-anchor="middle">✓</text>
      
      <g transform="translate(30, 220)">
        <text x="0" y="24" fill="#065f46" font-family="monospace" font-size="14" font-weight="bold">ADAPTIVE KINETIC MESH</text>
        <text x="0" y="65" fill="#18120d" font-family="system-ui" font-size="24" font-weight="800">Self-Adjusting Spinal Pivot</text>
        <text x="0" y="105" fill="#334155" font-family="system-ui" font-size="16">• 4-zone responsive tension matrix</text>
        <text x="0" y="135" fill="#334155" font-family="system-ui" font-size="16">• 100% breathable thermal dissipation</text>
        <text x="0" y="165" fill="#059669" font-family="system-ui" font-size="16" font-weight="bold">• Maintains 105° posture alignment</text>
      </g>
    </g>
  </g>

  <!-- Bottom Carousel Indicator & CTA -->
  <g transform="translate(80, 890)">
    <rect width="920" height="110" rx="22" fill="#18120d" />
    <text x="45" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">
      Multi-Slide Social Creative Format
    </text>
    <text x="45" y="80" fill="#d4976a" font-family="monospace" font-size="14">
      High-retention educational carousel design engineered for LinkedIn &amp; Instagram
    </text>

    <!-- Slide dots -->
    <g transform="translate(730, 48)">
      <circle cx="0" cy="8" r="5" fill="#574132" />
      <circle cx="20" cy="8" r="5" fill="#574132" />
      <rect x="35" y="3" width="24" height="10" rx="5" fill="#d4976a" />
      <circle cx="75" cy="8" r="5" fill="#574132" />
      <circle cx="95" cy="8" r="5" fill="#574132" />
    </g>
  </g>
</svg>