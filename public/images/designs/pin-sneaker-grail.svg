<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="sneaker-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="cyber-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="sneaker-glow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#sneaker-bg)" />
  <circle cx="500" cy="620" r="420" fill="#f59e0b" fill-opacity="0.10" filter="blur(80px)" />

  <!-- Top Pill -->
  <g transform="translate(100, 70)">
    <rect width="800" height="54" rx="27" fill="#1f1f23" stroke="#2e2e34" stroke-width="1.5" />
    <circle cx="45" cy="27" r="14" fill="#f59e0b" />
    <text x="45" y="32" fill="#111113" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">RF</text>
    <text x="75" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">RAREFINDS COLLECTOR VAULT</text>
    <rect x="630" y="12" width="150" height="30" rx="15" fill="#f59e0b" fill-opacity="0.15" />
    <text x="705" y="32" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VERIFIED AUTH</text>
  </g>

  <!-- Big Editorial Hook -->
  <text x="100" y="210" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3">1-OF-1 GRAIL DROP</text>
  <text x="100" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Jordan 1 Retro High OG
  </text>
  <text x="100" y="350" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    'Chicago' Lost &amp; Found
  </text>
  <text x="100" y="410" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="24" font-weight="500">
    Cryptographic PIN handover handover with NFC tamper-proof verification seal.
  </text>

  <!-- Hero Sneaker Showcase Graphic -->
  <g transform="translate(100, 470)" filter="url(#sneaker-glow)">
    <rect width="800" height="560" rx="28" fill="#141416" stroke="#27272a" stroke-width="2" />

    <!-- Sneaker Silhouette / Badge Box -->
    <rect x="150" y="140" width="500" height="240" rx="20" fill="#1c1c20" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="250" cy="260" r="60" fill="#ef4444" fill-opacity="0.2" />
    <circle cx="550" cy="260" r="60" fill="#ffffff" fill-opacity="0.1" />
    
    <!-- Graphic Elements -->
    <path d="M 230 300 Q 350 200 570 240 L 590 300 Z" fill="#ef4444" opacity="0.8" />
    <path d="M 240 300 L 580 300" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    
    <text x="400" y="185" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">SERIAL # RF-2026-8841</text>
    <text x="400" y="360" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Deadstock • Original 1985 Packaging</text>

    <!-- Price Tag floating -->
    <g transform="translate(560, 450)">
      <rect width="180" height="50" rx="25" fill="#f59e0b" />
      <text x="90" y="32" fill="#111113" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">$1,450 USD</text>
    </g>

    <g transform="translate(60, 450)">
      <rect width="200" height="50" rx="25" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="100" y="31" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">✓ AUTHENTICATED</text>
    </g>
  </g>

  <!-- 3 Mini Spec Badges -->
  <g transform="translate(100, 1080)">
    <rect width="250" height="230" rx="20" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <text x="125" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">5-PT</text>
    <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Physical QC</text>
    <text x="25" y="140" fill="#71717a" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
      <tspan x="125" dy="0">Blacklight UV stitching,</tspan>
      <tspan x="125" dy="22">weight &amp; sole rigidity check</tspan>
    </text>

    <g transform="translate(275, 0)">
      <rect width="250" height="230" rx="20" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="125" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">PIN</text>
      <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Secure Handover</text>
      <text x="25" y="140" fill="#71717a" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
        <tspan x="125" dy="0">Single-use encrypted code</tspan>
        <tspan x="125" dy="22">required at doorstep receipt</tspan>
      </text>
    </g>

    <g transform="translate(550, 0)">
      <rect width="250" height="230" rx="20" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="125" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">NFC</text>
      <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Vault Provenance</text>
      <text x="25" y="140" fill="#71717a" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
        <tspan x="125" dy="0">Scannable chip records</tspan>
        <tspan x="125" dy="22">consignment ownership history</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Save Ribbon -->
  <g transform="translate(100, 1360)">
    <rect width="800" height="70" rx="35" fill="url(#cyber-gold)" />
    <text x="400" y="44" fill="#111113" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      🔥 Tap To View Vault Inventory &amp; Consignment
    </text>
  </g>
</svg>
