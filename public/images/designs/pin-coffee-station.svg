<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="coffee-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21150f" />
      <stop offset="50%" stop-color="#180e0a" />
      <stop offset="100%" stop-color="#0e0805" />
    </linearGradient>
    <linearGradient id="crema-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#faedcd" />
    </linearGradient>
    <filter id="coffee-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#coffee-bg)" />
  <circle cx="500" cy="650" r="450" fill="#d4a373" fill-opacity="0.12" filter="blur(90px)" />

  <!-- Top Pill -->
  <g transform="translate(100, 70)">
    <rect width="800" height="54" rx="27" fill="#2d1c15" stroke="#4a2e22" stroke-width="1.5" />
    <circle cx="45" cy="27" r="14" fill="#d4a373" />
    <text x="45" y="32" fill="#21150f" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">☕</text>
    <text x="75" y="34" fill="#faedcd" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">SPECIALTY HOME BARISTA</text>
    <rect x="630" y="12" width="150" height="30" rx="15" fill="#d4a373" fill-opacity="0.15" />
    <text x="705" y="32" fill="#d4a373" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">E-COMMERCE PIN</text>
  </g>

  <!-- Big Editorial Hook -->
  <text x="100" y="210" fill="#d4a373" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3">BARISTA GRADE EQUIPMENT</text>
  <text x="100" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Dial In Cafe Quality
  </text>
  <text x="100" y="350" fill="#d4a373" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Espresso At Home.
  </text>
  <text x="100" y="410" fill="#b09b8c" font-family="system-ui, sans-serif" font-size="24" font-weight="500">
    The 3 indispensable precision accessories for zero-channeling 9-bar extractions.
  </text>

  <!-- Theatrical Visual Product Spotlight -->
  <g transform="translate(100, 470)" filter="url(#coffee-shadow)">
    <rect width="800" height="560" rx="28" fill="#150d09" stroke="#3a2217" stroke-width="2" />
    
    <!-- Central Portafilter / Scale Visualization -->
    <circle cx="400" cy="280" r="170" fill="#24140d" stroke="#523122" stroke-width="3" />
    <circle cx="400" cy="280" r="120" fill="#0d0805" />
    
    <!-- Rich crema gold indicator -->
    <path d="M 320 280 Q 400 340 480 280 Q 400 220 320 280 Z" fill="url(#crema-gold)" opacity="0.8" />
    <text x="400" y="286" fill="#180e0a" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">18.5g IN • 36g OUT</text>
    
    <!-- Spec Callout Ribbons -->
    <rect x="180" y="80" width="440" height="42" rx="21" fill="#281710" stroke="#4a2e22" stroke-width="1.5" />
    <text x="400" y="106" fill="#faedcd" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      58.5mm Precision High-Extraction Basket
    </text>

    <!-- Bottom Stat Bar -->
    <g transform="translate(120, 480)">
      <rect width="560" height="48" rx="24" fill="#0c0704" stroke="#3a2217" stroke-width="1.5" />
      <text x="140" y="30" fill="#d4a373" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">9.2 BAR STABLE</text>
      <circle cx="280" cy="24" r="4" fill="#523122" />
      <text x="420" y="30" fill="#d4a373" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">27 SEC SHOT TIME</text>
    </g>
  </g>

  <!-- 3 Mini Feature Badges -->
  <g transform="translate(100, 1080)">
    <rect width="250" height="230" rx="20" fill="#1f120c" stroke="#3d2317" stroke-width="1.5" />
    <text x="125" y="55" fill="#d4a373" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">01</text>
    <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">WDT Tool</text>
    <text x="25" y="140" fill="#9f8a7c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
      <tspan x="125" dy="0">0.3mm surgical steel</tspan>
      <tspan x="125" dy="22">declumping needles</tspan>
    </text>

    <g transform="translate(275, 0)">
      <rect width="250" height="230" rx="20" fill="#1f120c" stroke="#3d2317" stroke-width="1.5" />
      <text x="125" y="55" fill="#d4a373" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">02</text>
      <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Puck Screen</text>
      <text x="25" y="140" fill="#9f8a7c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
        <tspan x="125" dy="0">Uniform water dispersion</tspan>
        <tspan x="125" dy="22">cleaner shower screen</tspan>
      </text>
    </g>

    <g transform="translate(550, 0)">
      <rect width="250" height="230" rx="20" fill="#1f120c" stroke="#3d2317" stroke-width="1.5" />
      <text x="125" y="55" fill="#d4a373" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">03</text>
      <text x="125" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Timer Scale</text>
      <text x="25" y="140" fill="#9f8a7c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
        <tspan x="125" dy="0">0.1g ultra-responsive</tspan>
        <tspan x="125" dy="22">auto-tare flow sensor</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Save Ribbon -->
  <g transform="translate(100, 1360)">
    <rect width="800" height="70" rx="35" fill="url(#crema-gold)" />
    <text x="400" y="44" fill="#21150f" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      📌 Tap &amp; Save for Kitchen Setup Ideas
    </text>
  </g>
</svg>
