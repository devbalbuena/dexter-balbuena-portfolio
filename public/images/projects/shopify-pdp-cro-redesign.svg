      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cro-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accent-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008060" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pdp-bg)" />

  <!-- Outer Window Shell -->
  <rect x="25" y="16" width="750" height="418" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="25" y="16" width="750" height="38" rx="12" fill="#0F172A" />
  <circle cx="48" cy="35" r="5" fill="#EF4444" />
  <circle cx="64" cy="35" r="5" fill="#F59E0B" />
  <circle cx="80" cy="35" r="5" fill="#10B981" />
  <text x="100" y="39" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
