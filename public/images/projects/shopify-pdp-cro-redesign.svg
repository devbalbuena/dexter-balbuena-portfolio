  <!-- Bottom Metric Summary Bar -->
  <rect x="40" y="378" width="720" height="42" rx="6" fill="#0F172A" />
  
  <text x="55" y="403" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">AUDIT IMPACT:</text>
  
  <text x="145" y="403" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
    +57.8% Conversion Lift
  </text>
  <text x="285" y="403" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
    +67.3% Mobile ATC
  </text>
  <text x="415" y="403" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
    +$10.70 AOV via Bundles
  </text>
  <text x="575" y="403" fill="#F472B6" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
