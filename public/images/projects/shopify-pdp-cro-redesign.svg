    <rect x="122" y="206" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="130" y="220" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="700">📦 Fast Dispatch</text>

    <rect x="230" y="206" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="238" y="220" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="700">🔒 SSL Secure</text>

