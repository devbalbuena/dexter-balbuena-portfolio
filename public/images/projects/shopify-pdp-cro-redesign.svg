    <text x="48" y="116" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Med (80x40)</text>
    <rect x="118" y="104" width="72" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="124" y="116" fill="#475569" font-family="system-ui, sans-serif" font-size="8">Large (90x45)</text>

