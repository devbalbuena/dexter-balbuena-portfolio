    </text>
    <rect x="255" y="5" width="80" height="18" rx="3" fill="#991B1B" />
    <text x="263" y="17" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="700">1.85% CVR</text>

    <!-- Wireframe content -->
    <rect x="15" y="38" width="120" height="120" rx="4" fill="#E2E8F0" />
    <text x="50" y="103" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Image</text>

    <!-- Weak Buy Box -->
    <text x="145" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Desk Mat 80*40</text>
    <text x="145" y="70" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">$38.00</text>
    <text x="145" y="86" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Select Option:</text>
