  </text>
  <rect x="635" y="25" width="128" height="20" rx="4" fill="url(#cro-badge)" />
  <text x="647" y="39" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">CRO &amp; PDP AUDIT</text>

  <!-- Split Comparison Layout -->
  
