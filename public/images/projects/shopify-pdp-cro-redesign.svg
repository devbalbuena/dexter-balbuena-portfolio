    <rect x="15" y="234" width="315" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="24" y="247" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="700">▸ Dimensions &amp; Technical Specs</text>

    <rect x="15" y="256" width="315" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="24" y="269" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="700">▸ Materials &amp; Eco Care Guide</text>

    <rect x="15" y="278" width="315" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="24" y="291" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="700">▸ Shipping &amp; Hassle-Free Returns</text>
