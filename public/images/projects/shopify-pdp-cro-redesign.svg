    <text x="155" y="107" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Medium - Charcoal ▾</text>

    <rect x="145" y="122" width="185" height="28" rx="4" fill="#334155" />
    <text x="200" y="140" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Add to cart</text>

    <!-- Defect Callouts -->
    <rect x="15" y="170" width="315" height="120" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-dasharray="3,3" />
    <text x="25" y="188" fill="#991B1B" font-family="system-ui, sans-serif" font-size="10" font-weight="700">
