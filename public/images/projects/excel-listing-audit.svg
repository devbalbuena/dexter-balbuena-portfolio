<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="audit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#audit-bg)" />
  
  <!-- Window Container -->
  <rect x="35" y="25" width="730" height="400" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="35" y="25" width="730" height="42" rx="10" fill="#1e293b" />
  <circle cx="58" cy="46" r="5" fill="#ef4444" />
  <circle cx="75" cy="46" r="5" fill="#f59e0b" />
  <circle cx="92" cy="46" r="5" fill="#10b981" />
  <text x="115" y="51" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">02_Product_Listing_Audit.xlsx — Quality Control &amp; QA Checklist</text>
  <rect x="640" y="36" width="105" height="20" rx="4" fill="#7c3aed" />
  <text x="653" y="50" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">AUDIT SHEET</text>

  <!-- Title Banner -->
  <rect x="45" y="77" width="710" height="32" rx="4" fill="#0f172a" />
  <text x="60" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">MULTI-CHANNEL PRODUCT LISTING QUALITY AUDIT</text>
  
  <!-- Subtitle -->
  <rect x="45" y="112" width="710" height="22" rx="3" fill="#f1f5f9" />
  <text x="55" y="127" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Standardized QA checklist using IF/COUNTIF logic to identify missing content, images, and attribute gaps.</text>

  <!-- KPI Quick Cards -->
  <rect x="45" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="58" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL LISTINGS</text>
  <text x="58" y="184" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">8 SKUs</text>

  <rect x="225" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="238" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">READY FOR QA</text>
  <text x="238" y="184" fill="#059669" font-family="system-ui, sans-serif" font-size="18" font-weight="800">5 Listings</text>

  <rect x="405" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="418" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">NEEDS REVIEW</text>
  <text x="418" y="184" fill="#d97706" font-family="system-ui, sans-serif" font-size="18" font-weight="800">2 Listings</text>

  <rect x="585" y="142" width="170" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="598" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MAJOR UPDATE</text>
  <text x="598" y="184" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1 Listing</text>

  <!-- Table Header -->
  <rect x="45" y="204" width="710" height="26" fill="#1e293b" />
  <text x="55" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SKU</text>
  <text x="130" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Product Name</text>
  <text x="310" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Title</text>
  <text x="360" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Desc</text>
  <text x="410" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Images</text>
  <text x="470" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Listing Status</text>
  <text x="590" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Priority</text>
  <text x="655" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Action</text>

  <!-- Row 1 -->
  <rect x="45" y="230" width="710" height="25" fill="#ffffff" />
  <text x="55" y="246" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">DSK-001</text>
  <text x="130" y="246" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Adjustable Laptop Stand</text>
  <text x="315" y="246" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <text x="365" y="246" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <text x="420" y="246" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <rect x="465" y="234" width="95" height="17" rx="3" fill="#d1fae5" />
  <text x="480" y="246" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Ready for QA</text>
  <text x="595" y="246" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Low</text>
  <text x="655" y="246" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Routine check</text>

  <!-- Row 2 -->
  <rect x="45" y="255" width="710" height="25" fill="#f8fafc" />
  <text x="55" y="271" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">DSK-002</text>
  <text x="130" y="271" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Under-Desk Headphone Hanger</text>
  <text x="315" y="271" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <text x="365" y="271" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <text x="420" y="271" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">No</text>
  <rect x="465" y="259" width="95" height="17" rx="3" fill="#fef3c7" />
  <text x="480" y="271" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Needs Review</text>
  <rect x="588" y="259" width="40" height="17" rx="3" fill="#fee2e2" />
  <text x="595" y="271" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">High</text>
  <text x="655" y="271" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Update images</text>

  <!-- Row 3 -->
  <rect x="45" y="280" width="710" height="25" fill="#ffffff" />
  <text x="55" y="296" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">ORG-101</text>
  <text x="130" y="296" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Cable Management Spine</text>
  <text x="315" y="296" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Yes</text>
  <text x="365" y="296" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">No</text>
  <text x="420" y="296" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">No</text>
  <rect x="465" y="284" width="112" height="17" rx="3" fill="#fee2e2" />
  <text x="470" y="296" fill="#991b1b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Needs Major Update</text>
  <rect x="588" y="284" width="40" height="17" rx="3" fill="#fee2e2" />
  <text x="595" y="296" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">High</text>
  <text x="655" y="296" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Rewrite copy</text>

  <!-- Formula Callout -->
  <rect x="45" y="342" width="710" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="60" y="365" fill="#94a3b8" font-family="monospace" font-size="11">Automated QA Formula: </text>
  <text x="220" y="365" fill="#38bdf8" font-family="monospace" font-size="11">=IF(COUNTIF(C5:H5,"No")>=3, "Needs Major Update", IF(COUNTIF(C5:H5,"No")>=1, "Needs Review", "Ready for QA"))</text>
</svg>
