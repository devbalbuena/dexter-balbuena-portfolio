<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="print-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#print-bg)" />
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="40" y="30" width="720" height="45" rx="12" fill="#0369a1" />
  <circle cx="65" cy="52" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="85" cy="52" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="105" cy="52" r="6" fill="#10b981" opacity="0.8" />
  <text x="140" y="58" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Print_Shop_Kanban_Workflow [Production Floor Demo]</text>
  
  <!-- 3 Columns -->
  <!-- Col 1: Queued -->
  <rect x="65" y="95" width="210" height="305" rx="8" fill="#1e293b" />
  <text x="80" y="125" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IN QUEUE (3)</text>
  <rect x="75" y="145" width="190" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="88" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Brochures (1000 pcs)</text>
  <text x="88" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Gloss 150gsm • Tri-fold</text>
  <text x="88" y="208" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Proof Approved</text>

  <!-- Col 2: Printing -->
  <rect x="295" y="95" width="210" height="305" rx="8" fill="#1e293b" />
  <text x="310" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IN PRINT / PRESS (2)</text>
  <rect x="305" y="145" width="190" height="75" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="318" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Business Cards (500 sets)</text>
  <text x="318" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Matte Lam • 350gsm</text>
  <text x="318" y="208" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700">RUSH DEADLINE: 3 HRS</text>

  <!-- Col 3: Ready for Release -->
  <rect x="525" y="95" width="210" height="305" rx="8" fill="#1e293b" />
  <text x="540" y="125" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="700">QA PASSED / READY (4)</text>
  <rect x="535" y="145" width="190" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tarpaulin Banner (6x3 ft)</text>
  <text x="548" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Eyelets 4 corners</text>
  <text x="548" y="208" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Ready for Pickup</text>
</svg>
