<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flow-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008060" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="trigger-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#flow-bg)" />

  <!-- Outer Window Shell -->
  <rect x="25" y="16" width="750" height="418" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="25" y="16" width="750" height="38" rx="12" fill="#0F172A" />
  <circle cx="48" cy="35" r="5" fill="#EF4444" />
  <circle cx="64" cy="35" r="5" fill="#F59E0B" />
  <circle cx="80" cy="35" r="5" fill="#10B981" />
  <text x="100" y="39" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
    09_Shopify_Flow_Automations_Playbook.xlsx — Hands-Free Store Automation Logic (Dexter Balbuena)
  </text>
  <rect x="625" y="25" width="138" height="20" rx="4" fill="url(#flow-badge)" />
  <text x="636" y="39" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">SHOPIFY FLOW &amp; OPS</text>

  <!-- Title Banner -->
  <rect x="40" y="64" width="720" height="28" rx="4" fill="#008060" />
  <text x="52" y="82" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.05em">
    SHOPIFY FLOW AUTOMATED STORE OPERATIONS ARCHITECTURE (TRIGGER ➔ CONDITION ➔ ACTION)
  </text>

  <!-- WORKFLOW 1: VIP Customer Auto-Tagging -->
  <g transform="translate(40, 102)">
    <rect width="720" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Flow ID & Title -->
    <rect x="10" y="10" width="60" height="18" rx="3" fill="#0284C7" />
    <text x="18" y="23" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="800">FLOW 01</text>
    <text x="78" y="23" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      VIP Customer Retention &amp; Priority Fulfillment Pack
    </text>

    <!-- Trigger -->
    <rect x="10" y="36" width="140" height="28" rx="4" fill="#0284C7" />
    <text x="18" y="53" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">⚡ Order Created</text>

    <!-- Arrow 1 -->
    <text x="160" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" font-weight="700">➔</text>

    <!-- Condition Diamond -->
    <rect x="182" y="36" width="200" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" />
    <text x="190" y="53" fill="#92400E" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Spent &gt;= $250 OR Order &gt;= $150
    </text>

    <!-- Arrow 2 -->
    <text x="392" y="54" fill="#16A34A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">YES ➔</text>

    <!-- Action Outputs -->
    <rect x="435" y="36" width="135" height="28" rx="4" fill="#DCFCE7" stroke="#86EFAC" />
    <text x="443" y="53" fill="#166534" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Tag: VIP-Tier-1
    </text>

    <text x="578" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+</text>

    <rect x="592" y="36" width="118" height="28" rx="4" fill="#0F172A" />
    <text x="600" y="53" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Notify Slack Team
    </text>
  </g>

  <!-- WORKFLOW 2: Low-Stock Reorder Triggers -->
  <g transform="translate(40, 186)">
    <rect width="720" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Flow ID & Title -->
    <rect x="10" y="10" width="60" height="18" rx="3" fill="#0D9488" />
    <text x="18" y="23" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="800">FLOW 02</text>
    <text x="78" y="23" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      Real-Time Low-Stock Reorder Alert &amp; Scarcity Trigger
    </text>

    <!-- Trigger -->
    <rect x="10" y="36" width="140" height="28" rx="4" fill="#0D9488" />
    <text x="18" y="53" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">⚡ Stock Changed</text>

    <!-- Arrow 1 -->
    <text x="160" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" font-weight="700">➔</text>

    <!-- Condition Diamond -->
    <rect x="182" y="36" width="200" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" />
    <text x="190" y="53" fill="#92400E" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Inventory &lt;= 10 units &amp; Active
    </text>

    <!-- Arrow 2 -->
    <text x="392" y="54" fill="#16A34A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">YES ➔</text>

    <!-- Action Outputs -->
    <rect x="435" y="36" width="135" height="28" rx="4" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="443" y="53" fill="#B45309" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Tag: Low-Stock-Alert
    </text>

    <text x="578" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+</text>

    <rect x="592" y="36" width="118" height="28" rx="4" fill="#0F172A" />
    <text x="600" y="53" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Email Procurement
    </text>
  </g>

  <!-- WORKFLOW 3: High-Risk Fraud Quarantine -->
  <g transform="translate(40, 270)">
    <rect width="720" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Flow ID & Title -->
    <rect x="10" y="10" width="60" height="18" rx="3" fill="#DC2626" />
    <text x="18" y="23" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="800">FLOW 03</text>
    <text x="78" y="23" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      High-Risk Fraud Quarantine &amp; Chargeback Shield
    </text>

    <!-- Trigger -->
    <rect x="10" y="36" width="140" height="28" rx="4" fill="#DC2626" />
    <text x="18" y="53" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">⚡ Risk Analyzed</text>

    <!-- Arrow 1 -->
    <text x="160" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" font-weight="700">➔</text>

    <!-- Condition Diamond -->
    <rect x="182" y="36" width="200" height="28" rx="4" fill="#FEE2E2" stroke="#FCA5A5" />
    <text x="190" y="53" fill="#991B1B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Risk == HIGH OR Geo Mismatch
    </text>

    <!-- Arrow 2 -->
    <text x="392" y="54" fill="#DC2626" font-family="system-ui, sans-serif" font-size="12" font-weight="800">YES ➔</text>

    <!-- Action Outputs -->
    <rect x="435" y="36" width="135" height="28" rx="4" fill="#FEE2E2" stroke="#FCA5A5" />
    <text x="443" y="53" fill="#991B1B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Hold Order Delivery
    </text>

    <text x="578" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+</text>

    <rect x="592" y="36" width="118" height="28" rx="4" fill="#991B1B" />
    <text x="600" y="53" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
      Alert Founder ID
    </text>
  </g>

  <!-- Bottom Metric Summary Bar -->
  <rect x="40" y="354" width="720" height="66" rx="6" fill="#0F172A" />

  <text x="55" y="378" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
    BUSINESS AUTOMATION ROI (PER MONTH):
  </text>

  <g transform="translate(55, 386)">
    <text x="0" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">12.0 Hours / Wk</text>
    <text x="0" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Manual VA Time Saved</text>
  </g>

  <g transform="translate(230, 386)">
    <text x="0" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">$3,600.00 / Mo</text>
    <text x="0" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Founder Overhead Saved</text>
  </g>

  <g transform="translate(415, 386)">
    <text x="0" y="20" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Zero Stockouts</text>
    <text x="0" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Automated Reorder Alerts</text>
  </g>

  <g transform="translate(585, 386)">
    <text x="0" y="20" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="14" font-weight="800">100% Chargeback Shield</text>
    <text x="0" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Instant Fraud Quarantine</text>
  </g>
</svg>
