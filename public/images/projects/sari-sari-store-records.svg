<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="excel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#excel-bg)" />
  
  <!-- Outer Window -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <rect x="40" y="30" width="720" height="45" rx="12" fill="#042f2e" />
  <circle cx="65" cy="52" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="85" cy="52" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="105" cy="52" r="6" fill="#10b981" opacity="0.8" />
  <text x="140" y="58" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sari_Sari_Inventory_Ledger_v3.xlsx (MOS Excel Demo)</text>
  
  <!-- KPI Metrics Strip -->
  <rect x="65" y="90" width="200" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
  <text x="80" y="112" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">TOTAL MONITORED SKUs</text>
  <text x="80" y="145" fill="#f0fdf4" font-family="monospace" font-size="24" font-weight="700">142 Items</text>

  <rect x="290" y="90" width="210" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
  <text x="305" y="112" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">AVG DAILY MARGIN</text>
  <text x="305" y="145" fill="#4ade80" font-family="monospace" font-size="24" font-weight="700">22.8%</text>

  <rect x="525" y="90" width="210" height="70" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
  <text x="540" y="112" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11">LOW STOCK ALERTS</text>
  <text x="540" y="145" fill="#f87171" font-family="monospace" font-size="24" font-weight="700">5 SKUs (Restock)</text>

  <!-- Spreadsheet Grid -->
  <rect x="65" y="180" width="670" height="30" fill="#042f2e" />
  <text x="80" y="200" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SKU / Item Name</text>
  <text x="260" y="200" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Cost (PHP)</text>
  <text x="380" y="200" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Retail (PHP)</text>
  <text x="500" y="200" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Stock Qty</text>
  <text x="620" y="200" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Auto Alert</text>

  <rect x="65" y="215" width="670" height="32" fill="#0f172a" />
  <text x="80" y="236" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Evaporated Milk 370ml</text>
  <text x="260" y="236" fill="#cbd5e1" font-family="monospace" font-size="12">₱34.50</text>
  <text x="380" y="236" fill="#cbd5e1" font-family="monospace" font-size="12">₱42.00</text>
  <text x="500" y="236" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">2 pcs (CRITICAL)</text>
  <rect x="620" y="222" width="90" height="20" rx="4" fill="#dc2626" opacity="0.3" />
  <text x="630" y="236" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">REORDER NOW</text>

  <rect x="65" y="252" width="670" height="32" fill="#1e293b" />
  <text x="80" y="273" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Instant Coffee Sachet (Twin)</text>
  <text x="260" y="273" fill="#cbd5e1" font-family="monospace" font-size="12">₱12.00</text>
  <text x="380" y="273" fill="#cbd5e1" font-family="monospace" font-size="12">₱15.00</text>
  <text x="500" y="273" fill="#4ade80" font-family="monospace" font-size="12">36 pcs</text>
  <text x="630" y="273" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11">Optimal</text>

  <rect x="65" y="289" width="670" height="32" fill="#0f172a" />
  <text x="80" y="310" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Washing Powder 50g</text>
  <text x="260" y="310" fill="#cbd5e1" font-family="monospace" font-size="12">₱8.20</text>
  <text x="380" y="310" fill="#cbd5e1" font-family="monospace" font-size="12">₱11.00</text>
  <text x="500" y="310" fill="#4ade80" font-family="monospace" font-size="12">24 pcs</text>
  <text x="630" y="310" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11">Optimal</text>

  <!-- Formula Callout -->
  <rect x="65" y="340" width="670" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="80" y="360" fill="#a7f3d0" font-family="monospace" font-size="11">FORMULA =LET(sales, SUMIFS(tblSales[Qty], tblSales[SKU], [@SKU]), restock, [@MinBuffer] - [@Stock], IF(restock&gt;0, "REORDER NOW", "Optimal"))</text>
  <text x="80" y="378" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Advanced Excel Dynamic Array logic applied for hands-off operational inventory management.</text>
</svg>
