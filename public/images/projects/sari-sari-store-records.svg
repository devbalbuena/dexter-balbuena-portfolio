  <rect x="45" y="280" width="710" height="25" fill="#ffffff" />
  <text x="55" y="296" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">GRO-004</text>
  <text x="130" y="296" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">3-in-1 Coffee Sachet (Twin Pack)</text>
  <text x="315" y="296" fill="#475569" font-family="system-ui, sans-serif" font-size="10">50</text>
  <text x="365" y="296" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">9</text>
  <text x="415" y="296" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">41</text>
  <text x="470" y="296" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">₱15.00</text>
  <text x="550" y="296" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">₱615.00</text>
  <rect x="635" y="284" width="75" height="17" rx="3" fill="#d1fae5" />
  <text x="648" y="296" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Adequate</text>

  <!-- Formula Callout -->
  <rect x="45" y="342" width="710" height="38" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1" />
  <text x="60" y="365" fill="#a7f3d0" font-family="monospace" font-size="11">Reconciliation Formula: </text>
  <text x="235" y="365" fill="#6ee7b7" font-family="monospace" font-size="11">=Revenue - (Sold * Wholesale_Cost) | Credit Balance: =Original_Credit - Amount_Paid</text>
</svg>
