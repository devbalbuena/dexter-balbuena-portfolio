  <text x="130" y="246" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Canned Corned Beef (150g)</text>
  <text x="315" y="246" fill="#475569" font-family="system-ui, sans-serif" font-size="10">24</text>
  <text x="365" y="246" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">8</text>
  <text x="415" y="246" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">16</text>
  <text x="470" y="246" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">₱42.00</text>
  <text x="550" y="246" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">₱672.00</text>
  <rect x="635" y="234" width="75" height="17" rx="3" fill="#d1fae5" />
  <text x="648" y="246" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Adequate</text>

