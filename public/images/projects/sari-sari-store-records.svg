      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#retail-bg)" />
  
  <!-- Window Container -->
  <rect x="35" y="25" width="730" height="400" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="35" y="25" width="730" height="42" rx="10" fill="#1e293b" />
  <circle cx="58" cy="46" r="5" fill="#ef4444" />
  <circle cx="75" cy="46" r="5" fill="#f59e0b" />
  <circle cx="92" cy="46" r="5" fill="#10b981" />
  <text x="115" y="51" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">05_Family_Retail_Daily_Sales_Credit_Ledger.xlsx — Real Business Sample</text>
  <rect x="635" y="36" width="115" height="20" rx="4" fill="#0f766e" />
  <text x="647" y="50" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">RETAIL LEDGER</text>

