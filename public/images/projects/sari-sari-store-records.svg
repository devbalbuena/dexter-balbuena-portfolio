  <!-- Subtitle -->
  <rect x="45" y="112" width="710" height="22" rx="3" fill="#f1f5f9" />
  <text x="55" y="127" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Practical micro-retail bookkeeping | Daily stock depletion, wholesale markups, and customer receivables log.</text>

  <!-- 4 Executive KPI Quick Cards -->
  <rect x="45" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="58" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MONITORED SKUs</text>
  <text x="58" y="184" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">12 Staples</text>

  <rect x="225" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
