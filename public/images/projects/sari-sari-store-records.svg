  <text x="130" y="271" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Evaporated Milk (370ml Can)</text>
  <text x="315" y="271" fill="#475569" font-family="system-ui, sans-serif" font-size="10">16</text>
  <text x="365" y="271" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">2</text>
  <text x="415" y="271" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">14</text>
  <text x="470" y="271" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">₱42.00</text>
  <text x="550" y="271" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">₱588.00</text>
  <rect x="635" y="259" width="75" height="17" rx="3" fill="#fee2e2" />
  <text x="648" y="271" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">RESTOCK</text>

