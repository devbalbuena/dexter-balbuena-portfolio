<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="inv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#inv-bg)" />
  
  <!-- Window Container -->
  <rect x="35" y="25" width="730" height="400" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="35" y="25" width="730" height="42" rx="10" fill="#1e293b" />
  <circle cx="58" cy="46" r="5" fill="#ef4444" />
  <circle cx="75" cy="46" r="5" fill="#f59e0b" />
  <circle cx="92" cy="46" r="5" fill="#10b981" />
  <text x="115" y="51" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">03_Inventory_Reorder_Tracker.xlsx — Automated Stock Depletion &amp; Reorder</text>
  <rect x="640" y="36" width="105" height="20" rx="4" fill="#059669" />
  <text x="650" y="50" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">INVENTORY</text>

  <!-- Title Banner -->
  <rect x="45" y="77" width="710" height="32" rx="4" fill="#0f172a" />
  <text x="60" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DYNAMIC INVENTORY &amp; AUTOMATED REORDER POINT ENGINE</text>
  
  <!-- Subtitle -->
  <rect x="45" y="112" width="710" height="22" rx="3" fill="#f1f5f9" />
  <text x="55" y="127" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Dynamic replenishment modeling based on daily sales velocity, lead times, and safety buffers.</text>

  <!-- KPI Quick Cards -->
  <rect x="45" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="58" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL SKUs TRACKED</text>
  <text x="58" y="184" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">10 SKUs</text>

  <rect x="225" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="238" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ITEMS IN STOCK</text>
  <text x="238" y="184" fill="#059669" font-family="system-ui, sans-serif" font-size="18" font-weight="800">7 Healthy</text>

  <rect x="405" y="142" width="168" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="418" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REORDER ALERTS</text>
  <text x="418" y="184" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18" font-weight="800">3 Triggered</text>

  <rect x="585" y="142" width="170" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="598" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL CAPITAL AT RISK</text>
  <text x="598" y="184" fill="#8c532b" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$1,840.00</text>

  <!-- Table Header -->
  <rect x="45" y="204" width="710" height="26" fill="#1e293b" />
  <text x="55" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SKU</text>
  <text x="130" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Product Name</text>
  <text x="310" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Stock</text>
  <text x="370" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Daily Sales</text>
  <text x="450" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Reorder Pt</text>
  <text x="540" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Order Qty</text>
  <text x="645" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Status</text>

  <!-- Row 1 -->
  <rect x="45" y="230" width="710" height="25" fill="#ffffff" />
  <text x="55" y="246" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">DSK-001</text>
  <text x="130" y="246" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Adjustable Laptop Stand</text>
  <text x="310" y="246" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">42</text>
  <text x="380" y="246" fill="#475569" font-family="system-ui, sans-serif" font-size="10">3.2</text>
  <text x="460" y="246" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">32</text>
  <text x="550" y="246" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">0</text>
  <rect x="635" y="234" width="75" height="17" rx="3" fill="#d1fae5" />
  <text x="648" y="246" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">In Stock</text>

  <!-- Row 2 (Reorder Alert) -->
  <rect x="45" y="255" width="710" height="25" fill="#fef2f2" stroke="#fecaca" stroke-width="0.5" />
  <text x="55" y="271" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">DSK-002</text>
  <text x="130" y="271" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Under-Desk Headphone Hanger</text>
  <text x="310" y="271" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">18</text>
  <text x="380" y="271" fill="#475569" font-family="system-ui, sans-serif" font-size="10">4.0</text>
  <text x="460" y="271" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">28</text>
  <text x="550" y="271" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="700">66</text>
  <rect x="635" y="259" width="75" height="17" rx="3" fill="#fee2e2" />
  <text x="646" y="271" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">REORDER</text>

  <!-- Row 3 -->
  <rect x="45" y="280" width="710" height="25" fill="#ffffff" />
  <text x="55" y="296" fill="#0f172a" font-family="monospace" font-size="10" font-weight="600">ORG-101</text>
  <text x="130" y="296" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Cable Management Spine</text>
  <text x="310" y="296" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">55</text>
  <text x="380" y="296" fill="#475569" font-family="system-ui, sans-serif" font-size="10">2.1</text>
  <text x="460" y="296" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">21</text>
  <text x="550" y="296" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">0</text>
  <rect x="635" y="284" width="75" height="17" rx="3" fill="#d1fae5" />
  <text x="648" y="296" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">In Stock</text>

  <!-- Formula Callout -->
  <rect x="45" y="342" width="710" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="60" y="365" fill="#94a3b8" font-family="monospace" font-size="11">Reorder Point: </text>
  <text x="175" y="365" fill="#38bdf8" font-family="monospace" font-size="11">=ROUND(Daily_Sales * Lead_Time + Safety_Stock, 0)</text>
</svg>
